# Copie para config.yaml (que fica fora do git) e ajuste. Se config.yaml nao existir, o Hera cria um
# com estes valores ao iniciar.
#
# general.vault_dir: pasta do projeto dentro do seu vault do Obsidian. Vazio = usa $HERA_VAULT_DIR ou
#   ~/Documents/Obsidian Vault/Orquestrador Multiagente.
# general.allowed_repo_roots: pastas EXTRAS onde o HITL pode abrir propostas (alem da pasta do projeto).
#   So se edita aqui, com o servidor parado: a API recusa mudar este campo.
general:
  host: 127.0.0.1
  port: 8000
  default_offline: true
  default_engine: ollama
  vault_dir: ''
  db_path: data/orchestrator.db
engines:
  ollama:
    enabled: true
    base_url: http://localhost:11434
    default_model: qwen2.5-coder:1.5b
    timeout: 120.0
  nine_router:
    enabled: true
    base_url: http://127.0.0.1:20128/v1
    default_model: alicode-intl/qwen3.5-plus
    timeout: 60.0
  claude_code:
    enabled: true
    default_model: claude-3-7-sonnet
    timeout: 300.0
  antigravity:
    enabled: true
    default_model: gemini-2.5-pro
    timeout: 300.0
