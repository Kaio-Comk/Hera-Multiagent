[project]
name = "multiagent-orchestrator"
version = "0.1.0"
description = "Orquestrador Multiagente Local para Windows (Claude Code, Antigravity, 9Router, Ollama, Obsidian)"
authors = [{ name = "Kaio Lima" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
