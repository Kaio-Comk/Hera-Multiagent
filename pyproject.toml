[project]
name = "hera-multiagent"
version = "1.0.0"
description = "Hera Multiagent — The Sovereign Local AI Orchestrator for Windows (Ollama, Claude Code, Antigravity, 9Router, Obsidian)"
authors = [{ name = "Kaio Lima" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
