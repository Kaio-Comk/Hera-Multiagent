[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hera-multiagent"
version = "1.0.0"
description = "Hera Multiagent — The Sovereign Local AI Orchestrator for Windows (Ollama, Claude Code, Antigravity, Roteador embutido, Obsidian)"
authors = [{ name = "Kaio Lima" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "psutil>=5.9.0",
    "python-multipart>=0.0.9",     # /v1/audio/transcriptions (upload de audio)
    "prompt_toolkit>=3.0.40",      # hera chat (conversa no terminal)
]

[project.scripts]
hera = "main:cli"

[project.optional-dependencies]
# Janela desktop nativa (`python main.py gui`). Sem isso, use `python main.py web`.
gui = ["pywebview>=5.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

# Layout "flat" com vários pacotes de topo: o setuptools não adivinha, então listamos
# (sem isso `pip install -e .` falha com "Multiple top-level packages discovered").
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*", "adapters*", "models*", "cli*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
